site_name: DAP Manual
site_description: Homelab handbook for infrastructure, AI, Linux gaming, streaming and emulation.
site_author: David Armstrong-Porter

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
  palette:
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Roadmap: 00-Roadmap.md
  - Architecture: 01-Homelab-Architecture/index.md
  - Infrastructure:
      - Proxmox: 02-Proxmox/index.md
      - OPNsense: 03-OPNsense/index.md
      - Ubuntu: 04-Ubuntu/index.md
      - Docker: 05-Docker/index.md
      - Saltbox: 06-Saltbox/index.md
      - Networking: 07-Networking/index.md
  - AI:
      - AI Engineer: 08-AI-Engineer/index.md
      - Open WebUI: 09-Open-WebUI/index.md
      - Ollama: 10-Ollama/index.md
      - LiteLLM: 11-LiteLLM/index.md
      - OpenHands: 12-OpenHands/index.md
      - OpenCode: 13-OpenCode/index.md
  - Linux Gaming:
      - Overview: 14-Linux-Gaming/index.md
      - Steam: 15-Steam/index.md
      - Proton: 16-Proton/index.md
      - Wine: 17-Wine/index.md
      - Heroic: 18-Heroic/index.md
      - Lutris: 19-Lutris/index.md
      - Bottles: 20-Bottles/index.md
  - Streaming:
      - Sunshine: 21-Sunshine/index.md
      - Moonlight: 22-Moonlight/index.md
  - Emulation:
      - Overview: 23-Emulation/index.md
      - ES-DE: 24-ES-DE/index.md
      - RetroDECK: 25-RetroDECK/index.md
      - RetroArch: 26-RetroArch/index.md
